[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-adwin"
version = "0.1.0"
description = "Seasonality-aware ADWIN for traffic incident alerts (ITEC 5205)"
requires-python = ">=3.11"   # River 0.26.1 needs 3.11+
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "pyarrow>=12",
  "pyyaml>=6",
  "tables>=3.8",      # reads PEMS-BAY .h5
  "river==0.26.1",    # ADWIN only; we do NOT use River HoltWinters (F5)
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
